# Cross-platform ACL for the native XInput controller commands, granted from default.json.
#
# Same class of gap as the AI key commands (see ai-key-commands.toml):
# a command registered in lib.rs but listed in NO permission set is
# rejected by the packaged app with "Command xinput_status not allowed
# by ACL" — which would make the controller diagnostics (and the
# proof the whole 0.11.4 native-input release rests on) silently dead
# on the user's PC. Every xinput_* command the frontend invokes must
# stay listed here; tests/tauri-acl-coverage.test.ts enforces it.
#
# Only xinput_status is invoked from the frontend: the poll thread
# starts in Rust setup() and pushes input as Tauri events, which need
# no command grant.

[[permission]]
identifier = "allow-xinput-commands"
description = "Local-origin access to the native XInput controller status command."
commands.allow = [
    "xinput_status",
]
