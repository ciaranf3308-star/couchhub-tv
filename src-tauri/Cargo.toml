[package]
name = "app"
version = "0.4.0"
description = "NylahBox Studios — Xbox-controller-first IPTV player, fork of Extreme InfiniTV (GPL-3.0-or-later)"
authors = ["CouchHub"]
license = "GPL-3.0-or-later"
repository = "https://github.com/infinitel8p/Extreme-InfiniTV"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = "0.4"
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
rand = "0.9"
gethostname = "1.1"
futures-util = "0.3"
bytes = "1"
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
# keyring has NO default features: without these it silently falls back to
# an in-memory mock store. windows-native = Windows Credential Manager,
# apple-native = macOS Keychain, linux-native-sync-persistent = kernel
# keyutils + Secret Service (gnome-keyring/KWallet) on Linux.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
discord-rich-presence = "0.2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["io-util", "process", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
mdns-sd = "0.21"

# Also used on Android by the receiver_discover subnet sweep fallback (no mDNS there).
[target.'cfg(not(target_os = "ios"))'.dependencies]
if-addrs = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = { version = "=28.1.0", features = [] }
