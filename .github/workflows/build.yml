name: Build CouchHub TV

# Windows CI build for the fork. Upstream's release.yml still owns
# tag-triggered releases; this workflow only verifies that the fork
# builds on Windows and publishes the installer as an artifact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Tauri, Windows x64)
        run: pnpm tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CouchHub-TV-win-x64
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
