name: Build NylahBox Studios

# Windows CI build for the fork. Upstream's release.yml still owns
# tag-triggered releases; this workflow only verifies that the fork
# builds on Windows and publishes the installer as an artifact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here: package.json pins pnpm via packageManager
      # (pnpm@10.31.0) and the action errors if both are given.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Tauri, Windows x64)
        run: pnpm tauri build
        env:
          # Signs the installer and emits the updater manifest (latest.json).
          # Empty on fork PRs (secrets are not passed there); the publish step
          # below only runs on pushes to main, where the secrets exist.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CouchHub-TV-win-x64
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

      # Publishes the signed installer + updater manifest to the public
      # GitHub Pages feed (couchhub-updates repo) so installed copies of the
      # app auto-update on launch. Pushes to main only, never PRs.
      - name: Check out updates repo
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ciaranf3308-star/couchhub-updates
          ssh-key: ${{ secrets.UPDATES_DEPLOY_KEY }}
          path: couchhub-updates

      - name: Publish update feed
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          FEED_BASE="https://ciaranf3308-star.github.io/couchhub-updates/couchhub-tv"
          FEED_DIR="couchhub-updates/couchhub-tv"
          VERSION="$(jq -r .version package.json)"
          echo "Publishing NylahBox Studios $VERSION to $FEED_BASE"

          # Tauri v2's bundler only emits the signed installers (.sig files);
          # it does NOT generate the updater manifest, so update.json is
          # built from the signed installer below (after the version guard).
          NSIS_INSTALLER="$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' -print -quit 2>/dev/null || true)"
          test -n "$NSIS_INSTALLER" || { echo "::error::No NSIS installer found in src-tauri/target/release/bundle/nsis/"; exit 1; }
          test -f "$NSIS_INSTALLER.sig" || { echo "::error::Missing signature: $NSIS_INSTALLER.sig (build did not sign the installer)"; exit 1; }
          INSTALLER_NAME="$(basename "$NSIS_INSTALLER")"
          # The installer filename contains a space; percent-encode it for
          # every URL the feed serves (Pages decodes %20 back to the file).
          ENCODED_NAME="${INSTALLER_NAME// /%20}"
          echo "Installer: $NSIS_INSTALLER"

          # Version guard: the feed must never be overwritten with different
          # files under the same version. Bump the version (package.json,
          # src-tauri/tauri.conf.json, src-tauri/Cargo.toml) to ship a new build.
          if curl -fsSL "$FEED_BASE/update.json" -o /tmp/existing-update.json; then
            EXISTING_VERSION="$(jq -r .version /tmp/existing-update.json)"
            if [ "$EXISTING_VERSION" = "$VERSION" ]; then
              if curl -fsSL "$FEED_BASE/$ENCODED_NAME.sig" -o /tmp/existing.sig; then
                if ! cmp -s /tmp/existing.sig "$NSIS_INSTALLER.sig"; then
                  echo "::error::Feed already contains version $VERSION with different files. Bump the version in package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml before pushing."
                  exit 1
                fi
              fi
              echo "Version $VERSION is already published identically; nothing to do."
              exit 0
            fi
          fi

          mkdir -p "$FEED_DIR"

          # Build the updater manifest in the format the plugin expects:
          # version, pub_date, and per-platform url + signature (the verbatim
          # content of the generated .sig file, per the Tauri v2 updater docs).
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg version "$VERSION" \
            --arg date "$PUB_DATE" \
            --arg url "$FEED_BASE/$ENCODED_NAME" \
            --arg sig "$(cat "$NSIS_INSTALLER.sig")" \
            --arg notes "NylahBox Studios $VERSION" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > "$FEED_DIR/update.json"

          cp "$NSIS_INSTALLER" "$NSIS_INSTALLER.sig" "$FEED_DIR/"
          # Also publish the MSI + signature when present (handy for a manual
          # install from the feed; the updater itself uses the NSIS build).
          for f in src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/msi/*.msi.sig; do
            [ -e "$f" ] && cp "$f" "$FEED_DIR/"
          done

          cd couchhub-updates
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "NylahBox Studios $VERSION"
          git push origin HEAD:main
